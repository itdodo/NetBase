name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: 后端构建与测试
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: "netbase"
          POSTGRES_PASSWORD: "YourStrong@Password1"
          POSTGRES_DB: "netbase"
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U netbase -d netbase"
          --health-interval 10s
          --health-retries 10
          --health-start-period 15s
    env:
      NETBASE_TEST_CONNECTIONSTRING: "Host=localhost;Port=5433;Database=netbase_test;Username=netbase;Password=YourStrong@Password1"
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: 安装 PostgreSQL 客户端（备份测试用 pg_dump）
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] http://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: 还原依赖
        run: dotnet restore

      - name: 构建
        run: dotnet build --no-restore -c Release

      - name: 单元测试
        run: dotnet test tests/NetBase.Tests --no-build -c Release

      - name: 集成测试
        run: dotnet test tests/NetBase.IntegrationTests --no-build -c Release

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run type-check

      - name: 构建
        run: npm run build
