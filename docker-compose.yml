# NetBase 两容器部署：应用 + PostgreSQL 17
# 用法：docker compose -p netbase up -d --build
# 注意：生产环境务必通过环境变量覆盖 Jwt__SecretKey 与数据库密码
services:
  db:
    image: postgres:18-alpine
    container_name: netbase-db
    command: ["postgres", "-N", "200", "-c", "timezone=Asia/Shanghai"]   # max_connections=200（默认 100 会被 api 连接池占满）
    environment:
      TZ: "Asia/Shanghai"
      PGTZ: "Asia/Shanghai"
      POSTGRES_USER: "netbase"
      POSTGRES_PASSWORD: "YourStrong@Password1"
      POSTGRES_DB: "netbase"
    ports:
      - "${NETBASE_DB_PORT:-5544}:5432"   # 宿主机调试用；api 容器走内部网络不受影响。默认 5544 避开 Windows 保留区间与本机 5432 占用
    volumes:
      # 复用既有数据卷（保留 admin 账号/密码、验证码开关等全部数据）；全新环境删除 external 两行即可自动建卷
      - netbase-pg18-data:/var/lib/postgresql   # PG18 要求单挂载点：数据在子目录 /data，便于 pg_upgrade --link
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netbase -d netbase || exit 1"]
      interval: 10s
      retries: 10
      start_period: 15s

  redis:
    image: redis:8.2-alpine
    container_name: netbase-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - netbase-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
      start_period: 5s

  api:
    build: .
    container_name: netbase-api
    environment:
      TZ: "Asia/Shanghai"
      ASPNETCORE_ENVIRONMENT: "Production"
      Db__ConnectionString: "Host=db;Port=5432;Database=netbase;Username=netbase;Password=YourStrong@Password1;Maximum Pool Size=50"
      ConnectionStrings__Hangfire: "Host=db;Port=5432;Database=netbase;Username=netbase;Password=YourStrong@Password1;Maximum Pool Size=10"
      Jwt__SecretKey: "CHANGE_ME_Please-Use-A-Random-Key-At-Least-32-Chars-Long!"
      # 备份目录指向挂载卷（pg_dump 在 api 容器内执行，镜像已内置 postgresql-client-17）
      Backup__Directory: "/app/backup"
      Cache__Provider: "MultiLevel"
      Cache__RedisConnectionString: "redis:6379,abortConnect=false"
    ports:
      - "${NETBASE_API_PORT:-8680}:8080"   # 前端+API 同端口（镜像内置前端构建产物）；默认 8680 避开保留区间（每次重启可能重排，bind 失败先查 netsh excludedportrange）
    volumes:
      - netbase-backup:/app/backup
      - netbase-uploads:/app/uploads       # 用户上传（头像等）持久化，重建容器不丢
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  netbase-pg18-data:
  netbase-backup:
  netbase-uploads:
  netbase-redis-data:
