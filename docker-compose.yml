# NetBase 两容器部署：应用 + PostgreSQL 17
# 用法：docker compose up -d
# 注意：生产环境务必通过环境变量覆盖 Jwt__SecretKey 与数据库密码
services:
  db:
    image: postgres:17-alpine
    container_name: netbase-db
    environment:
      POSTGRES_USER: "netbase"
      POSTGRES_PASSWORD: "YourStrong@Password1"
      POSTGRES_DB: "netbase"
    ports:
      - "${NETBASE_DB_PORT:-5432}:5432"   # 宿主机端口可用环境变量覆盖（如本机 5432 被占：NETBASE_DB_PORT=5434），容器间通信不受影响
    volumes:
      - netbase-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netbase -d netbase || exit 1"]
      interval: 10s
      retries: 10
      start_period: 15s

  api:
    build: .
    container_name: netbase-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      Db__ConnectionString: "Host=db;Port=5432;Database=netbase;Username=netbase;Password=YourStrong@Password1"
      ConnectionStrings__Hangfire: "Host=db;Port=5432;Database=netbase;Username=netbase;Password=YourStrong@Password1"
      Jwt__SecretKey: "CHANGE_ME_Please-Use-A-Random-Key-At-Least-32-Chars-Long!"
      # 备份目录指向挂载卷（pg_dump 在 api 容器内执行，镜像已内置 postgresql-client-17）
      Backup__Directory: "/app/backup"
    ports:
      - "${NETBASE_API_PORT:-8080}:8080"   # 宿主机端口可用环境变量覆盖（如本机 8080 被占：NETBASE_API_PORT=8081）
    volumes:
      - netbase-backup:/app/backup
    depends_on:
      db:
        condition: service_healthy

volumes:
  netbase-db:
  netbase-backup:
