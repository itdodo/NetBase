# NetBase 两容器部署：应用 + PostgreSQL 17
# 用法：docker compose -p netbase up -d --build
# 注意：生产环境务必通过环境变量覆盖 Jwt__SecretKey 与数据库密码
services:
  db:
    image: postgres:17-alpine
    container_name: netbase-db
    environment:
      POSTGRES_USER: "netbase"
      POSTGRES_PASSWORD: "YourStrong@Password1"
      POSTGRES_DB: "netbase"
    ports:
      - "${NETBASE_DB_PORT:-5544}:5432"   # 宿主机调试用；api 容器走内部网络不受影响。默认 5544 避开 Windows 保留区间与本机 5432 占用
    volumes:
      # 复用既有数据卷（保留 admin 账号/密码、验证码开关等全部数据）；全新环境删除 external 两行即可自动建卷
      - netbase-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netbase -d netbase || exit 1"]
      interval: 10s
      retries: 10
      start_period: 15s

  api:
    build: .
    container_name: netbase-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      Db__ConnectionString: "Host=db;Port=5432;Database=netbase;Username=netbase;Password=YourStrong@Password1"
      ConnectionStrings__Hangfire: "Host=db;Port=5432;Database=netbase;Username=netbase;Password=YourStrong@Password1"
      Jwt__SecretKey: "CHANGE_ME_Please-Use-A-Random-Key-At-Least-32-Chars-Long!"
      # 备份目录指向挂载卷（pg_dump 在 api 容器内执行，镜像已内置 postgresql-client-17）
      Backup__Directory: "/app/backup"
    ports:
      - "${NETBASE_API_PORT:-8081}:8080"   # 前端+API 同端口（镜像内置前端构建产物）；默认 8081 避开本机 8080
    volumes:
      - netbase-backup:/app/backup
      - netbase-uploads:/app/uploads       # 用户上传（头像等）持久化，重建容器不丢
    depends_on:
      db:
        condition: service_healthy

volumes:
  netbase-pg-data:
    external: true
    name: netbase-pg-data
  netbase-backup:
  netbase-uploads:
